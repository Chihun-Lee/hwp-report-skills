# 양식 프로필 — 엔진이 양식 안에서 위치를 찾는 제목 글자(정규식, 문단 앞뒤 공백을 뺀 글자와 비교)
# 다른 양식을 등록하면(hr.py config add-form) 이 파일을 복사해 맞는 것만 남기고, 없는 것은 null로 둔다.
# null이거나 양식에서 못 찾은 절은 건너뛴다(그 절 내용이 spec에 있으면 경고).
name: 연차점검 보고서 양식1 구조 (예시 양식 — 기관명 ○○ 처리)
form: form.hwpx

anchors:
  title_ko: '^과제명\(국문\)$'            # 표지 국문 과제명 자리
  title_en: '^과제명\(영문\)$'            # 표지 영문 과제명 자리
  org: '^\S+(연구원|대학교|기관)$'                # 표지 기관명(날짜 자리를 이 앞에서 찾음)
  cover_date: '^\d{4}\.\s*\d{1,2}\.?$'    # 표지 날짜
  submit_sentence: '이 보고서를'          # 제출문 문장(따옴표 안에 과제명)
  date: '\d{4}년\s+\d{1,2}월\s+\d{1,2}일' # 제출문·요약표 확인란 날짜
  toc: '^<\s*목\s*차\s*>$'
  toc_attachments: '^\[별첨자료\]'
  overview: '연구개발과제의 개요$'        # 1장 (목차에도 같은 글자가 있어 마지막 것을 씀)
  work: '^2\.\s*연구개발과제의 수행과정'  # 2장
  review: '진도점검 지적사항'             # 2장 끝 표
  results: '^3\.\s*연구개발과제의 수행 결과'
  progress: '^1\)\s*당해연도'
  targets: '^2\)\s*기술적 성과목표'
  outputs: '^3\)\s*세부 정량적'
  outputs_note: '^※\s*해당되는 항목만'
  unplanned: '^4\)\s*계획하지 않은'
  unplanned_note: '^※\s*해당하는 경우'
  budget: '^5\)\s*연구개발비 사용실적'
  next_year: '^4\.\s*다음 연도'
  references: '^5\.\s*참고문헌'

samples: ['ｏ 세부설명', '- 세부설명', '‧ 세부설명']   # 양식의 예시 문단(본문으로 바꿔 넣을 자리)
sign_placeholder: 'ㅇ  ㅇ  ㅇ'                          # 요약표 확인란 이름 자리
review_title: 'ｏ 진도점검 지적사항 및 반영사항'
header_rows: {review: 1, progress: 1, targets: 2}
