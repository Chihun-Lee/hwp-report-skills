# 1. 개요 — 계획서 문장을 그대로 인용, 개조식 명사형 종결, 마침표 없음
overview: |
  o 최종목표: 소재 시험평가 절차를 표준화하고 측정 데이터를 한 체계로 모아 기관 공용 데이터로 구축
  o 1차년도 목표
  - (세부기술1) 시험 절차 표준화 및 기준 시료 데이터 확보
  - (세부기술2) 데이터 표준 양식 설계
  o 성과목표: 데이터 구축 건수 1차년도 500건, 분석 도구 1건

# 2. 수행 내용 — ## = 세부기술 절 제목, [그림 ID] = figs/ID.jpg
work: |
  ## (세부기술1) 시험 절차 표준화
  - 시료 1개를 4분할 절단하여 경도와 OM 측정을 한 마운트에서 진행하도록 시험 절차 표준화
  · 측정 위치를 고정하여 위치별 편차를 데이터에 반영
  [그림 ex_flow] 시료 1개 시험 절차
  - 기준 시료 5종 OM 상대밀도 측정 완료
  · 평균 98.6 %, 기준 98.5 % 미만 2종
  [그림 ex_chart 폭=120] 시료별 OM 상대밀도
  ## (세부기술2) 데이터 표준 양식 설계
  ※ 데이터 표준 타입·스키마 설계 내용은 ○○○ 작성분으로 수합

